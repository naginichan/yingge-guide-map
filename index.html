      { id: "wc_starbucks", name: "Starbucks星巴克 鶯歌門市（店內洗手間）", category: "shop-toilet", catLabel: "🏪 有廁所的店家", meta: "咖啡店內廁所", hasToilet: true, lat: 24.9538, lng: 121.3484, rating: 4.4, count: 1891, review: "老街入口旁紅磚特色星巴克，點杯飲料休息時可方便使用店內洗手間。" },
      { id: "wc_mcd", name: "麥當勞-鶯歌文化餐廳（店內洗手間）", category: "shop-toilet", catLabel: "🏪 有廁所的店家", meta: "快餐店內廁所", hasToilet: true, lat: 24.9543, lng: 121.3538, rating: 3.7, count: 1593, review: "火車站步行往老街必經路上，點餐或休憩時使用店內廁所非常方便。" },
      { id: "wc_museum", name: "新北市立鶯歌陶瓷博物館（館內洗手間）", category: "shop-toilet", catLabel: "🏪 有廁所的店家", meta: "博物館內廁所", hasToilet: true, lat: 24.9493, lng: 121.3519, rating: 4.5, count: 16800, review: "陶博館各樓層及戶外園區皆設有寬敞整潔的無障礙與親子洗手間。" }
    ];

    let currentCategory = 'all';
    let useGoogleMap = false;
    let gMap = null;
    let gMarkers = {};
    let gInfoWindow = null;
    let lMap = null;
    let lMarkers = {};

    function getCategoryColor(cat) {
      if (cat === 'spot') return '#2563eb';
      if (cat === 'food') return '#ea580c';
      if (cat === 'toilet') return '#16a34a';
      return '#9333ea';
    }

    function showStatus(msg, bg = '#fef3c7', color = '#92400e') {
      const bar = document.getElementById('status-bar');
      bar.style.background = bg;
      bar.style.color = color;
      bar.textContent = msg;
    }

    window.gm_authFailure = function() {
      initFallbackLeafletMap();
      showStatus("⚠️ Google Maps 授權受限（請確認 Google Cloud 金鑰設定已儲存且包含網址白名單），目前已自動切換為免費街道地圖。", "#ffedd5", "#9a3412");
    };

    function initMapEngine() {
      // 先立即渲染所有地點卡片，確保畫面秒開不空白
      renderAll();

      const params = new URLSearchParams({
        key: GOOGLE_API_KEY,
        language: "zh-TW",
        region: "TW",
        callback: "onGoogleMapsLoaded"
      });
      const script = document.createElement('script');
      script.src = "https://maps.googleapis.com/maps/api/js?" + params.toString();
      script.async = true;
      script.onerror = function() {
        initFallbackLeafletMap();
      };
      document.head.appendChild(script);
    }

    window.onGoogleMapsLoaded = function() {
      useGoogleMap = true;
      gMap = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 24.9530, lng: 121.3502 },
        zoom: 16,
        mapTypeControl: false,
        streetViewControl: false
      });
      gInfoWindow = new google.maps.InfoWindow();
      renderAll();
      showStatus("✅ Google Maps 原生街道地圖已載入！點擊右上角「🔄 同步最新 Google 評論」即可抓取即時星等與評論。", "#dcfce7", "#166534");
    };

    function initFallbackLeafletMap() {
      useGoogleMap = false;
      if (lMap) { lMap.invalidateSize(); return; }
      lMap = L.map('map').setView([24.9530, 121.3502], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap 貢獻者'
      }).addTo(lMap);
      renderAll();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    function renderAll() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (useGoogleMap) {
        Object.values(gMarkers).forEach(m => m.setMap(null));
        gMarkers = {};
      } else if (lMap) {
        Object.values(lMarkers).forEach(m => lMap.removeLayer(m));
        lMarkers = {};
      }

      const filtered = placesData.filter(p => {
        const matchCat = currentCategory === 'all' || p.category === currentCategory;
        const matchKey = !keyword ||
          p.name.toLowerCase().includes(keyword) ||
          p.meta.toLowerCase().includes(keyword) ||
          p.review.toLowerCase().includes(keyword) ||
          p.catLabel.includes(keyword) ||
          (keyword.includes('廁') && p.hasToilet);
        return matchCat && matchKey;
      });

      document.getElementById('countInfo').textContent = "目前顯示 " + filtered.length + " 個地點（點擊地圖圖釘或卡片「地圖定位」可查看詳細位置）";

      filtered.forEach(p => {
        const gmapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name + " 新北市鶯歌區");
        const color = getCategoryColor(p.category);
        const wcTag = p.hasToilet ? '<span class="badge has-wc">🚻 內設洗手間</span>' : '';
        const popupHtml = '<div style="font-family:sans-serif;max-width:240px;line-height:1.45;">' +
          '<div style="font-size:12px;color:' + color + ';font-weight:700;">' + p.catLabel + (p.hasToilet ? ' ・ 🚻 有廁所' : '') + '</div>' +
          '<div style="font-size:15px;font-weight:700;margin:2px 0;">' + p.name + '</div>' +
          '<div style="font-size:12px;color:#57534e;margin-bottom:2px;">' + p.meta + '</div>' +
          '<div style="font-size:13px;color:#d97706;font-weight:700;">⭐ ' + p.rating + ' <span style="color:#666;font-weight:400;">(' + p.count.toLocaleString() + ' 則評論)</span></div>' +
          '<div style="font-size:12px;color:#444;margin:6px 0;">「' + p.review + '」</div>' +
          '<a href="' + gmapUrl + '" target="_blank" style="display:inline-block;margin-top:4px;color:#b45309;font-weight:700;text-decoration:none;">🗺️ 開啟 Google 地圖導航 →</a>' +
          '</div>';

        if (useGoogleMap && gMap) {
          const marker = new google.maps.Marker({
            position: { lat: p.lat, lng: p.lng },
            map: gMap,
            title: p.name,
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 9,
              fillColor: color,
              fillOpacity: 0.95,
              strokeColor: '#ffffff',
              strokeWeight: 2
            }
          });
          marker.addListener('click', () => {
            gInfoWindow.setContent(popupHtml);
            gInfoWindow.open(gMap, marker);
            highlightCard(p.id);
          });
          gMarkers[p.id] = marker;
        } else if (lMap) {
          const marker = L.circleMarker([p.lat, p.lng], {
            radius: 9,
            fillColor: color,
            color: '#fff',
            weight: 2,
            fillOpacity: 0.95
          }).addTo(lMap);
          marker.bindPopup(popupHtml);
          marker.on('click', () => highlightCard(p.id));
          lMarkers[p.id] = marker;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.id = 'card-' + p.id;

        const topDiv = document.createElement('div');
        topDiv.innerHTML =
          '<div class="badges-row">' +
            '<span class="badge ' + p.category + '">' + p.catLabel + '</span>' +
            wcTag +
          '</div>' +
          '<h3>' + p.name + '</h3>' +
          '<div class="meta">' + p.meta + '</div>' +
          '<div class="rating">⭐ ' + p.rating + ' <span>(' + p.count.toLocaleString() + ' 則 Google 評論)</span></div>' +
          '<div class="review-box">💬 「' + p.review + '」</div>';

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';

        const locateBtn = document.createElement('button');
        locateBtn.className = 'btn-locate';
        locateBtn.textContent = '📍 地圖定位';
        locateBtn.addEventListener('click', () => focusPlace(p.id));

        const gmapLink = document.createElement('a');
        gmapLink.className = 'btn-gmap';
        gmapLink.href = gmapUrl;
        gmapLink.target = '_blank';
        gmapLink.textContent = '🗺️ Google 導航';

        actionsDiv.appendChild(locateBtn);
        actionsDiv.appendChild(gmapLink);

        card.appendChild(topDiv);
        card.appendChild(actionsDiv);
        grid.appendChild(card);
      });
    }

    function focusPlace(id) {
      const p = placesData.find(item => item.id === id);
      if (!p) return;
      highlightCard(id);
      if (useGoogleMap && gMap && gMarkers[id]) {
        gMap.panTo({ lat: p.lat, lng: p.lng });
        gMap.setZoom(17);
        google.maps.event.trigger(gMarkers[id], 'click');
      } else if (lMap && lMarkers[id]) {
        lMap.flyTo([p.lat, p.lng], 17);
        lMarkers[id].openPopup();
      }
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function highlightCard(id) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('highlight'));
      const el = document.getElementById('card-' + id);
      if (el) el.classList.add('highlight');
    }

    async function syncGooglePlaces(forceRefresh = false) {
      const cacheKey = "yingge_places_zh_tw_full_v5";
      const cached = localStorage.getItem(cacheKey);
      if (!forceRefresh && cached) {
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.timestamp < 24 * 60 * 60 * 1000) {
          placesData = parsed.data;
          renderAll();
          showStatus("✅ 已載入 24 小時內的 Google Places API 快取資料（節省 API 免費額度）。", "#dcfce7", "#166534");
          return;
        }
      }

      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      showStatus("⏳ 正在連線 Google Places API (New) 同步最新星等、評論數與旅客評論...");

      let successCount = 0;
      for (let item of placesData) {
        if (item.category === 'toilet') continue;
        const cleanQueryName = item.name.replace(/（.*?）/g, '');
        try {
          const res = await fetch("https://places.googleapis.com/v1/places:searchText", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Goog-Api-Key": GOOGLE_API_KEY,
              "X-Goog-FieldMask": "places.displayName,places.rating,places.userRatingCount,places.reviews,places.location"
            },
            body: JSON.stringify({
              textQuery: cleanQueryName + " 新北市鶯歌區",
              languageCode: "zh-TW",
              maxResultCount: 1
            })
          });
          const json = await res.json();
          const place = json.places && json.places[0];
          if (place) {
            successCount++;
            if (place.rating) item.rating = place.rating;
            if (place.userRatingCount) item.count = place.userRatingCount;
            if (place.location) {
              item.lat = place.location.latitude;
              item.lng = place.location.longitude;
            }
            if (place.reviews && place.reviews[0] && place.reviews[0].text && place.reviews[0].text.text) {
              item.review = place.reviews[0].text.text;
            }
          }
        } catch (err) {
          console.error("同步失敗:", item.name, err);
        }
      }

      btn.disabled = false;
      if (successCount > 0) {
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: placesData }));
        renderAll();
        showStatus("✅ 同步完成！已從 Google Places API 更新 " + successCount + " 個地點的最新星等、座標與旅客評論。", "#dcfce7", "#166534");
      } else {
        showStatus("⚠️ 無法從 Google API 取得資料：請確認 Google Cloud 金鑰設定已儲存且包含 https://naginichan.github.io/*", "#fee2e2", "#991b1b");
      }
    }

    initMapEngine();
  </script>
</body>
</html>
